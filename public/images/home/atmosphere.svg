<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <!-- Blancos arquitectónicos · ~4–5 volúmenes amplios · baja densidad horizontal -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#F8FAFB"/>
      <stop offset="100%" stop-color="#F1F4F6"/>
    </linearGradient>
    <linearGradient id="faceFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7F9"/>
    </linearGradient>
    <linearGradient id="faceSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9EDF1"/>
      <stop offset="100%" stop-color="#DCE3E8"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F7F9"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accentHair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2581C4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2581C4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2581C4" stop-opacity="0"/>
    </linearGradient>
    <filter id="ambient" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFB"/>
  <rect width="1600" height="900" fill="url(#field)"/>

  <!-- Plano lejano suave (profundidad, no fragmentación) -->
  <g opacity="0.55" filter="url(#ambient)">
    <path d="M980 120 L1380 200 L1380 620 L980 540 Z" fill="#E9EDF1"/>
    <path d="M980 120 L1180 40 L1580 120 L1380 200 Z" fill="#F5F7F9"/>
  </g>

  <!-- Volumen 1 — izquierda, amplio -->
  <g>
    <path d="M-80 220 L420 140 L420 720 L-80 800 Z" fill="url(#faceFront)"/>
    <path d="M420 140 L620 220 L620 800 L420 720 Z" fill="url(#faceSide)"/>
    <path d="M-80 220 L120 140 L620 220 L420 140 Z" fill="url(#faceTop)"/>
  </g>

  <!-- Volumen 2 — centro, protagonista -->
  <g>
    <path d="M460 300 L980 220 L980 780 L460 860 Z" fill="url(#faceFront)"/>
    <path d="M980 220 L1180 300 L1180 860 L980 780 Z" fill="url(#faceSide)"/>
    <path d="M460 300 L660 220 L1180 300 L980 220 Z" fill="url(#faceTop)"/>
  </g>

  <!-- Volumen 3 — derecha, gran plano -->
  <g>
    <path d="M1120 180 L1680 100 L1680 640 L1120 720 Z" fill="url(#faceFront)"/>
    <path d="M1680 100 L1780 160 L1780 700 L1680 640 Z" fill="url(#faceSide)"/>
    <path d="M1120 180 L1220 100 L1780 160 L1680 100 Z" fill="url(#faceTop)"/>
  </g>

  <!-- Volumen 4 — inferior medio, ancla espacial -->
  <g opacity="0.92">
    <path d="M280 640 L820 580 L820 940 L280 1000 Z" fill="#FFFFFF"/>
    <path d="M820 580 L960 640 L960 1000 L820 940 Z" fill="url(#faceSide)"/>
    <path d="M280 640 L420 580 L960 640 L820 580 Z" fill="url(#faceTop)"/>
  </g>

  <!-- Separaciones / juntas muy suaves -->
  <g stroke="#F1F4F6" stroke-width="3" fill="none" opacity="0.9">
    <path d="M170 260 L370 228"/>
    <path d="M560 340 L760 308"/>
    <path d="M1220 220 L1420 188"/>
  </g>

  <!-- Acento azul discreto -->
  <rect x="0" y="410" width="1600" height="70" fill="url(#accentHair)"/>
</svg>
